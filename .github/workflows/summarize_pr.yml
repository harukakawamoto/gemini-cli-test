name: PR Summary
on:
  pull_request:
    types:
      - opened
      - synchronize
permissions:
  pull-requests: write
  contents: read
jobs:
  summarize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Summarize PR
        uses: google-gemini/gemini-cli-action@main
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          prompt: "このブランチの作業内容をただ要約してPRにコメントしてほしい。PRの番号は${{ github.event.pull_request.number }}です。"

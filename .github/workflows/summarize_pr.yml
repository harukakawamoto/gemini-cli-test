name: PR Summary
on:
  pull_request:
    types:
      - opened
      - synchronize
permissions:
  pull-requests: write
  contents: read
jobs:
  summarize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Summarize PR
        uses: google-gemini/gemini-cli-action@main
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          output_file: pr_summary.txt
          prompt: "${{ github.ref_name }} の Pull Request に含まれる File Change 部分を要約してください。出力はプレーンテキスト形式で、変更点の概要を簡潔に述べてください。コメント以外のことはしないでください"
      - name: post summary as comment
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          BODY=$(cat pr_summary.txt)
          gh pr comment ${{ github.event.pull_request.number }} --body "$BODY"

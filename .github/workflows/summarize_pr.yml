name: PR Summary

on:
  pull_request:
    types:
      - opened
      - synchronize

permissions:
  pull-requests: write
  contents: read

jobs:
  summarize:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Generate diff file
        run: |
          git fetch origin ${{ github.base_ref }}
          git diff origin/${{ github.base_ref }}...HEAD > pr_diff.txt

      - name: Summarize PR
        uses: google-gemini/gemini-cli-action@main
        with:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          prompt: "${{ github.ref_name }} の Pull Request に含まれる File Change 部分を要約してください。出力はプレーンテキスト形式で、変更点の概要を簡潔に述べてください。要点がまとめられたら、PRにコメントしてください"

      # - name: Post summary as comment
      #   env:
      #     GH_TOKEN: ${{ secrets.GH_TOKEN }}
      #   run: |
      #     BODY=$(cat pr_summary.txt)
      #     gh pr comment ${{ github.event.pull_request.number }} --body "$BODY"

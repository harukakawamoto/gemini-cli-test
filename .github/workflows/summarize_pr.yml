name: PR Summary
on:
  pull_request:
    types:
      - opened
      - synchronize
jobs:
  summarize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Summarize PR
        uses: google-gemini/gemini-cli-actions@v1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          command: "git diff ${{ github.event.pull_request.base.sha }} ${{ github.event.pull_request.head.sha }} | gemini summarize"

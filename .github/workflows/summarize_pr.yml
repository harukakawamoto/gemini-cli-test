name: PR Summary
on:
  pull_request:
    types:
      - opened
      - synchronize

permissions:
  pull-requests: write
  contents: read

jobs:
  summarize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Summarize PR
        uses: google-gemini/gemini-cli-action@main
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          prompt: "${{ github.ref_name }}のFile Change部分をただ要約してgh pr commentで要約コメントを追加してほしい。PRの番号は${{ github.event.pull_request.number }}です。"

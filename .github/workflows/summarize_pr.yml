name: PR Summary
on:
  pull_request:
    types:
      - opened
      - synchronize

permissions:
  pull-requests: write
  contents: read

jobs:
  summarize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Install Gemini CLI
        run: npm install 0g @google/gemini-cli
      - name: Generate PR Summary
        run: |
          git fetch origin ${{ github.event.pull_request.base.ref }}
          git diff origin/${{ github.event.pull_request.base.ref }}...HEAD > diff.txt
          SUMMARY=$(cat diff.txt | gemini summarize --yolo --prompt "${{ github.ref_name }}のFile Change部分をただ要約してgh pr commentで要約コメントを追加してほしい")
          echo "$SUMMARY" > summary.txt
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      - name: install github cli
        run: sudo apt-get update && sudo apt-get install -y gh
      - name: comment summary on PR
        run: |
          gh pr comment ${{ github.event.pull_request.number }} --body-file summary.txt
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}

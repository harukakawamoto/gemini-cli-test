name: PR Diff Summary

on:
  pull_request:
    types: [opened, reopened, synchronize]

jobs:
  summarize-pr-diff:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    permissions:
      pull-requests: write
      contents: read
      id-token: write

    steps:
      - name: Generate GitHub App Token
        id: generate_token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.PRIVATE_KEY }}

      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ steps.generate_token.outputs.token }}
          fetch-depth: 0 # 差分のため履歴が必要

      - name: Get PR Diff
        id: get_diff
        run: |
          git fetch origin ${{ github.base_ref }}
          git diff origin/${{ github.base_ref }}...HEAD > pr_diff.txt

      - name: Summarize Diff using Gemini
        id: summarize
        uses: google-gemini/gemini-cli-action@main
        env:
          GITHUB_TOKEN: ${{ steps.generate_token.outputs.token }}
        with:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          input_file: pr_diff.txt
          output_file: pr_summary.txt
          prompt: |
            You are a code review assistant. Your task is to summarize the changes in this pull request.
            Please produce a concise and developer-friendly summary of the diff.
            Focus on:
            - What was changed
            - Why it was changed (if apparent)
            - Key impacted components

      - name: Post Summary as Comment
        run: |
          COMMENT_BODY=$(cat pr_summary.txt)
          gh pr comment ${{ github.event.pull_request.number }} --body "$COMMENT_BODY"
        env:
          GH_TOKEN: ${{ steps.generate_token.outputs.token }}
